name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run all checks
        run: bash scripts/check.sh
      - name: Tag must match VERSION
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' plugin/deye.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build zip
        run: bash scripts/build.sh "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          bash scripts/release_notes.sh "$VERSION" > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/deye-menubar-$VERSION.zip" \
            --title "Deye Menubar $VERSION" --notes-file notes.md
